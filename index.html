<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabel Telegram</title>
  <style>
    body {
      background-color: #17212b;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
    }
    .table-container {
      overflow-x: auto;
      border: 1px solid #2b394a;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 400px;
    }
    th, td {
      border: 1px solid #2b394a;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #232e3c;
      color: #79a5d1;
    }
    tr:nth-child(even) {
      background-color: #1e2c3a;
    }
  </style>
</head>
<body>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>月份 (Bulan)</th>
          <th>1111baba</th>
          <th>22bbbb</th>
          <th>333bbbb</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>5月</td>
          <td>38.38%</td>
          <td>28.26%</td>
          <td>10.12%</td>
        </tr>
        <tr>
          <td>6月</td>
          <td>39.28%</td>
          <td>29.04%</td>
          <td>10.24%</td>
        </tr>
        <tr>
          <td>7月</td>
          <td>38.36%</td>
          <td>30.16%</td>
          <td>8.20%</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
